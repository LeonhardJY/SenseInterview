server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**,/api/auth/**,/api/resume/**
          filters:
            - StripPrefix=0

        - id: interview-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/interview/**,/api/report/**,/api/job/**,/api/hot/**,/api/evaluation/**
          filters:
            - StripPrefix=0

        - id: question-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/question/**
          filters:
            - StripPrefix=0

        - id: ai-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

        # WebSocket — 面试房间实时通信
        - id: interview-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-32-char-secret}

logging:
  level:
    org.springframework.cloud.gateway: debug