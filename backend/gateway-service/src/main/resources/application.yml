server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0

        - id: interview-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/interview/**
          filters:
            - StripPrefix=0

        - id: question-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/question/**
          filters:
            - StripPrefix=0

        - id: evaluation-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/evaluation/**
          filters:
            - StripPrefix=0

        - id: report-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/report/**
          filters:
            - StripPrefix=0

        - id: ai-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

jwt:
  secret: your-256-bit-secret-key-here

logging:
  level:
    org.springframework.cloud.gateway: debug