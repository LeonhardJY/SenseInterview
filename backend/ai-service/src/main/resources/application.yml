server:
  port: 8086

spring:
  application:
    name: ai-service
  redis:
    host: localhost
    port: 6379
    database: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: REPLACED-JWT-SECRET
  expiration: 86400000

ai:
  # AI模型配置
  # (ASR 使用浏览器原生 Web Speech API，无需后端配置)
  model:
    # NLP自然语言处理配置
    nlp:
      provider: aliyun
      app-key: your-app-key
      access-key-id: your-access-key-id
      access-key-secret: your-access-key-secret
    # LLM大语言模型配置 (DeepSeek)
    llm:
      provider: deepseek
      api-key: ${SENSE_LLM_KEY:sk-placeholder}
      api-url: https://api.deepseek.com
      model: deepseek-v4-flash

  # 音频上传配置
  upload:
    audio-dir: ./uploads/audio

  # 情绪分析服务（DeepFace Python 微服务）
  emotion:
    service-url: http://localhost:5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn