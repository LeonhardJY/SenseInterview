server:
  port: 8086

spring:
  application:
    name: ai-service
  redis:
    host: localhost
    port: 6379
    database: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-32-char-secret}
  expiration: 86400000

ai:
  # AI模型配置
  # (ASR 使用浏览器原生 Web Speech API，无需后端配置)
  model:
    # NLP自然语言处理配置
    nlp:
      provider: aliyun
      app-key: ${SENSE_NLP_APP_KEY:your-app-key}
      access-key-id: ${SENSE_NLP_ACCESS_KEY_ID:your-access-key-id}
      access-key-secret: ${SENSE_NLP_ACCESS_KEY_SECRET:your-access-key-secret}
    # LLM大语言模型配置 (DeepSeek)
    llm:
      provider: deepseek
      api-key: ${SENSE_LLM_KEY:sk-placeholder}
      api-url: https://api.deepseek.com
      model: deepseek-v4-flash

  # RAG 检索增强配置
  rag:
    # 向量化模型（本地 Ollama，nomic-embed-text 维度 768）
    embedding:
      base-url: http://localhost:11434
      model: nomic-embed-text
    # 向量数据库（本地 Qdrant）
    qdrant:
      host: localhost
      port: 6333
      collection: interview_knowledge
      dimension: 768
    # 知识源目录（classpath:knowledge 下按公司分类的 md 文件）
    knowledge-dir: classpath:knowledge
    # 检索返回条数
    top-k: 4

  # question-service 直连地址（Agent 查题库用，本地开发直连 8083）
  question-service-url: http://localhost:8083

  # 音频上传配置
  upload:
    audio-dir: ./uploads/audio

  # 情绪分析服务（DeepFace Python 微服务）
  emotion:
    service-url: http://localhost:5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn