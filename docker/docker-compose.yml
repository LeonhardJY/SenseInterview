# 敏感配置（数据库密码、JWT密钥）默认用于本地开发，
# 生产环境请在同目录 .env 文件中覆盖（参考 docker/.env.example）。

services:
  # ============ 基础服务 ============
  mysql:
    image: mysql:8.0
    container_name: ai-interview-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ai_interview
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/database/ai_interview.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-interview-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: ai-interview-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # 首次需拉取向量化模型：docker exec ai-interview-ollama ollama pull nomic-embed-text

  # ============ 后端服务 ============
  user-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.java
      args:
        SERVICE_NAME: user-service
    container_name: ai-interview-user
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_interview?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-char-secret}
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      - mysql
      - redis

  interview-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.java
      args:
        SERVICE_NAME: interview-service
    container_name: ai-interview-interview
    restart: always
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_interview?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-char-secret}
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      - mysql
      - redis

  question-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.java
      args:
        SERVICE_NAME: question-service
    container_name: ai-interview-question
    restart: always
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_interview?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-char-secret}
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      - mysql
      - redis

  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.java
      args:
        SERVICE_NAME: ai-service
    container_name: ai-interview-ai
    restart: always
    ports:
      - "8086:8080"
    environment:
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-char-secret}
      SENSE_LLM_KEY: ${SENSE_LLM_KEY:-sk-placeholder}
      SERVER_ADDRESS: 0.0.0.0
      # 跨容器访问用 docker DNS 服务名（容器内各 Java 服务均监听 8080）
      AI_QUESTION_SERVICE_URL: http://question-service:8080
      AI_EMOTION_SERVICE_URL: http://emotion-service:5000
      AI_RAG_QDRANT_HOST: qdrant
      AI_RAG_EMBEDDING_BASE_URL: http://ollama:11434
    depends_on:
      - redis
      - qdrant
      - ollama
      - question-service
      - emotion-service

  # ============ 多模态情绪识别（DeepFace Python 微服务）============
  emotion-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.emotion
    container_name: ai-interview-emotion
    restart: always
    ports:
      - "5000:5000"

  # ============ 前端 ============
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ai-interview-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - user-service
      - interview-service
      - question-service
      - ai-service

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  ollama-data: